# ===================================================================
# DATABASE
# ===================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/banhcanh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# ===================================================================
# JPA / HIBERNATE
# ===================================================================

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# SERVER
# ===================================================================

server.port=${PORT:8080}

# ===================================================================
# UTF-8
# ===================================================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================================================================
# FILE UPLOAD
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# S3 / Object storage configuration
s3.access-key=${AWS_ACCESS_KEY_ID:}
s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
s3.region=${AWS_DEFAULT_REGION:us-east-1}
s3.bucket-name=${AWS_S3_BUCKET_NAME:}
s3.endpoint=${AWS_ENDPOINT_URL:}