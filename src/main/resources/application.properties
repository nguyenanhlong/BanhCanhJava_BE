# ===================================================================
# DATABASE (PostgreSQL for Supabase)
# ===================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banhcanh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HIKARICP CONNECTION POOL (Supabase optimized)
# ===================================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1


# ===================================================================
# JPA / HIBERNATE
# ===================================================================


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# SERVER
# ===================================================================

server.port=${PORT:8080}

# ===================================================================
# UTF-8
# ===================================================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================================================================
# FILE UPLOAD
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Supabase Storage (S3-compatible) configuration
s3.access-key=${SUPABASE_S3_ACCESS_KEY:dummy}
s3.secret-key=${SUPABASE_S3_SECRET_KEY:dummy}
s3.region=${SUPABASE_S3_REGION:ap-southeast-2}
s3.bucket-name=${SUPABASE_S3_BUCKET_NAME:Image}
s3.endpoint=${SUPABASE_S3_ENDPOINT:https://yrzsuspxgiggepfnzqgi.storage.supabase.co/storage/v1/s3}
