name: Java CI với Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4
    
    # Cấu hình môi trường Java 17 để chạy dự án
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Tiến hành biên dịch code và đóng gói thử file .jar
    # Đã thêm -DskipTests để không bị lỗi kết nối Database khi chạy CI
    - name: Build with Maven
      run: mvn -B package -DskipTests --file pom.xml